name: pkgdown

on:
  workflow_dispatch:

jobs:
  pkgdown:
    if: github.repository == 'csglab/MPAQT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          dependencies: '"hard"'

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(preview = FALSE)'

      - name: Normalize public website links
        run: python3 .github/scripts/normalize_site.py docs

      - name: Update documentation branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
