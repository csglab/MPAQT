package:
  name: r-mpaqt-full
  version: "2.4.0"

source:
  git_url: https://github.com/csglab/MPAQT.git
  git_rev: v2.4.0

build:
  number: 0
  noarch: generic

requirements:
  host:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    # CLI-only dependency; disabled while the CLI remains unsupported.
    # - r-optparse
  run:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    # CLI-only dependency; disabled while the CLI remains unsupported.
    # - r-optparse
    # Required tools
    - kallisto >=0.50.1
    - bustools >=0.43.1
    # Optional tools for long-read processing
    - minimap2
    - samtools
    # Bioconductor for long-read FLNC processing
    - bioconductor-bambu
    - bioconductor-biocfilecache
    - bioconductor-summarizedexperiment
    # Bioconductor for transcriptome extraction
    - bioconductor-biostrings
    - bioconductor-rtracklayer
    - bioconductor-genomicranges
    - bioconductor-iranges
    - bioconductor-bsgenome

test:
  commands:
    - R -e "library(mpaqt)"
    - R -e "stopifnot(as.character(packageVersion('mpaqt')) == '2.4.0')"
    - R -e "stopifnot(requireNamespace('Biostrings', quietly = TRUE))"
    - R -e "stopifnot(requireNamespace('rtracklayer', quietly = TRUE))"
    # CLI smoke test disabled; the release exposes only the R API.
    # - mpaqt --help
    - test ! -e "$PREFIX/bin/mpaqt"
    - kallisto version
    - bustools version
    - minimap2 --version
    - samtools --version
    - R -e "library(bambu)"

about:
  home: https://github.com/csglab/MPAQT
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Multi-Platform Accurate Quantification of Transcripts (Full)
  description: |
    MPAQT is an R package for RNA-seq transcript quantification that
    integrates short-read and long-read sequencing data for improved accuracy.
    This full version includes all optional dependencies for long-read FLNC
    processing (minimap2, samtools, bambu) and transcriptome extraction.
  doc_url: https://csglab.github.io/MPAQT/
  dev_url: https://github.com/csglab/MPAQT

extra:
  recipe-maintainers:
    - saberiato
  authors:
    - Ali Saberi
    - Michael Apostolides
    - Jichen Wang
    - Hamed S. Najafabadi
