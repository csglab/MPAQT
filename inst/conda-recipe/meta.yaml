package:
  name: r-mpaqt
  version: "2.4.0"

source:
  git_url: https://github.com/csglab/MPAQT_merged.git
  git_rev: main

build:
  number: 0
  noarch: generic

requirements:
  host:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    - r-optparse
  run:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    - r-optparse
    - kallisto >=0.50.1
    - bustools >=0.43.1

test:
  commands:
    - R -e "library(mpaqt)"
    - mpaqt --help
    - kallisto version
    - bustools version

about:
  home: https://github.com/csglab/MPAQT_merged
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Multi-Platform Accurate Quantification of Transcripts
  description: |
    MPAQT is an R package for RNA-seq transcript quantification that
    integrates short-read and long-read sequencing data for improved accuracy.
    It supports both bulk and single-cell RNA-seq analysis.
  doc_url: https://csglab.github.io/mpaqt2/
  dev_url: https://github.com/csglab/MPAQT_merged

extra:
  recipe-maintainers:
    - saberiato
  authors:
    - Ali Saberi
    - Michael Apostolides
    - Jichen Wang
    - Hamed S. Najafabadi
