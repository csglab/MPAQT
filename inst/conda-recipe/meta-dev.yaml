package:
  name: r-mpaqt-dev
  version: "2.4.0"

source:
  git_url: https://github.com/csglab/MPAQT.git
  git_rev: v2.4.0

build:
  number: 1
  noarch: generic

requirements:
  host:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    # CLI-only dependency; disabled while the CLI remains unsupported.
    # - r-optparse
  run:
    - r-base >=4.0.0
    - r-data.table >=1.14.0
    - r-matrix
    - r-lme4
    - r-gpboost
    - r-cli >=3.0.0
    - r-rlang >=1.0.0
    - r-stringr
    - r-purrr
    # CLI-only dependency; disabled while the CLI remains unsupported.
    # - r-optparse
    # Required by mpaqt_index()
    - bioconductor-biostrings
    - bioconductor-rtracklayer
    # Required tools
    - kallisto >=0.50.1
    - bustools >=0.43.1
    # Development tools
    - r-devtools
    - r-roxygen2
    - r-usethis
    # Testing
    - r-testthat >=3.0.0
    # Documentation
    - r-knitr
    - r-rmarkdown
    - r-pkgdown
    # PDF compression
    - qpdf
    # Code quality
    - r-lintr
    - r-styler
    # Build and release tools
    - apptainer
    - anaconda-client
    - conda-build

test:
  commands:
    - R -e "library(mpaqt)"
    - R -e "stopifnot(as.character(packageVersion('mpaqt')) == '2.4.0')"
    - R -e "stopifnot(requireNamespace('Biostrings', quietly = TRUE))"
    - R -e "stopifnot(requireNamespace('rtracklayer', quietly = TRUE))"
    # CLI smoke test disabled; the release exposes only the R API.
    # - mpaqt --help
    - test ! -e "$PREFIX/bin/mpaqt"
    - kallisto version
    - bustools version
    - R -e "library(testthat)"
    - R -e "library(devtools)"

about:
  home: https://github.com/csglab/MPAQT
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Multi-Platform Accurate Quantification of Transcripts (Development)
  description: |
    MPAQT is an R package for RNA-seq transcript quantification that
    integrates short-read and long-read sequencing data for improved accuracy.
    This development version includes tools for package development, testing,
    and documentation generation.
  doc_url: https://csglab.github.io/MPAQT/
  dev_url: https://github.com/csglab/MPAQT

extra:
  recipe-maintainers:
    - saberiato
  authors:
    - Ali Saberi
    - Michael Apostolides
    - Jichen Wang
    - Hamed S. Najafabadi
